# Für Unraid (Docker Compose Manager): fertiges Image von GitHub + Cloudflare Tunnel
services:
  game:
    image: ghcr.io/7ulez/three-in-the-wild:latest
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/three-in-the-wild:/data      # hier liegt die Bestenliste (bleibt nach Neustart/Update erhalten)
    environment:
      GAME_PASSWORD: "PASSWORT"
      WS_URL: "wss://ws.DEINE-DOMAIN"
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "TUNNEL-TOKEN"
    depends_on:
      - game
